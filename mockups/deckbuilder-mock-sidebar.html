<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck Builder Mock — Sidebar</title>
<meta name="viewport" content="width=1280, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<base href="/">
<link rel="stylesheet" href="css/style.css">
<!--
  MOCK ONLY — not wired into the game. Version 2: one top bar, a LEFT FILTER
  COLUMN (25%) and the card grid (75%), sized so 2.25 rows are visible — the
  third row peeks in, which tells the player there is more to scroll to.
  Uses the game's own stylesheet, fonts, card data and card art.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #mk-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #mk-stage { width: 1280px; height: 720px; position: relative; flex-shrink: 0; transform-origin: center center; overflow: hidden; }

  /* Screen background: the deck builder's own parchment-dark weave. */
  .mk-screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 9px),
      repeating-linear-gradient(0deg,  rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 13px),
      linear-gradient(168deg, #2c1a08 0%, #1e1106 35%, #261608 65%, #1a0e04 100%); }

  /* ── TOP BAR: one 56px row (the original header was 141px in two rows), split on the SAME
       320 / 960 line as the body: screen identity over the filter column, deck controls over the grid ── */
  .mk-header { flex-shrink: 0; height: 56px; box-sizing: border-box; display: flex; align-items: stretch;
    background: rgba(12, 6, 2, 0.94); border-bottom: 2px solid rgba(200, 160, 32, 0.55); }
  .mk-hleft { flex: 0 0 320px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px;
    border-right: 2px solid rgba(200, 160, 32, 0.45); }
  .mk-hright { flex: 1; min-width: 0; box-sizing: border-box; padding: 0 16px 0 14px; display: flex; align-items: center; gap: 12px; }
  .mk-hdiv { width: 2px; height: 30px; background: rgba(200, 160, 32, 0.35); flex-shrink: 0; margin: 0 2px; }
  .mk-btn { font-family: var(--font); font-size: 12px; letter-spacing: 0.08em; color: #f4d678; background: rgba(60, 36, 8, 0.92);
    border: 2px solid rgba(212, 170, 80, 0.95); border-radius: 2px; padding: 0 12px; height: 36px; box-sizing: border-box; cursor: pointer; text-shadow: 1px 1px 0 #000; white-space: nowrap; }
  .mk-btn.mk-play { font-size: 13px; padding: 0 18px; color: #2a1608; text-shadow: none; border-color: #f0d890;
    background: linear-gradient(180deg, #f0d488 0%, #c9a24a 100%); box-shadow: 0 0 10px rgba(240, 207, 108, 0.35); }
  .mk-btn.mk-play.off { color: #7a6a48; background: rgba(40, 24, 8, 0.85); border-color: rgba(150, 112, 40, 0.55); box-shadow: none; cursor: default; }
  .mk-title { flex: 1; text-align: center; font-family: var(--font); font-size: 18px; letter-spacing: 0.14em; color: #e8c060; text-transform: uppercase; text-shadow: 1px 1px 0 #000; white-space: nowrap; }
  .mk-tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .mk-tab { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 8px; box-sizing: border-box;
    font-family: var(--font); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #b89a5a;
    background: rgba(40, 24, 8, 0.85); border: 2px solid rgba(150, 112, 40, 0.55); border-radius: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .mk-tab.active { color: #2a1608; background: linear-gradient(180deg, #e8c878 0%, #c9a24a 100%); border-color: #f0d890; text-shadow: none; }
  .mk-tab span.mk-pencil { opacity: 0.7; font-size: 11px; }
  .mk-counter { font-family: var(--font); font-size: 15px; color: #f4d678; letter-spacing: 0.06em; text-shadow: 1px 1px 0 #000; white-space: nowrap; min-width: 74px; text-align: center; }
  .mk-counter.full { color: #7ef08a; }
  .mk-counter.deny { animation: mkDeny 0.36s ease-out; color: #ff7a6a; }
  @keyframes mkDeny { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .mk-help { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(212, 170, 80, 0.9); color: #f4d678; font: 600 12px var(--font); display: flex; align-items: center; justify-content: center; }

  /* ── BODY: left filter column (25%) + card grid (75%) ── */
  .mk-body { flex: 1; min-height: 0; display: flex; }
  .mk-side { flex: 0 0 320px; box-sizing: border-box; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
    background: rgba(18, 10, 3, 0.92); border-right: 2px solid rgba(200, 160, 32, 0.45); }
  .mk-search { position: relative; }
  .mk-search input { width: 100%; box-sizing: border-box; height: 36px; padding: 0 30px 0 34px; font: 600 15px 'Source Sans 3', sans-serif; color: #f3e6c4;
    background: rgba(8, 4, 1, 0.85); border: 2px solid rgba(180, 130, 40, 0.65); border-radius: 2px; outline: none; }
  .mk-search input:focus { border-color: #f0cf6c; box-shadow: 0 0 8px rgba(240, 207, 108, 0.35); }
  .mk-search input::placeholder { color: rgba(243, 230, 196, 0.45); font-weight: 400; }
  .mk-search::before { content: '\2315'; position: absolute; left: 10px; top: 5px; font-size: 20px; color: #d4aa50; pointer-events: none; }
  .mk-search .mk-x { position: absolute; right: 8px; top: 8px; width: 20px; height: 20px; line-height: 18px; text-align: center; color: #d4aa50; cursor: pointer; font-size: 15px; display: none; }
  .mk-search.has-text .mk-x { display: block; }
  .mk-group { display: flex; flex-direction: column; gap: 7px; }
  .mk-label { font-family: var(--font); font-size: 11px; letter-spacing: 0.14em; color: rgba(232, 192, 96, 0.85); text-transform: uppercase;
    border-bottom: 1px solid rgba(180, 130, 40, 0.35); padding-bottom: 4px; }
  .mk-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mk-chip { --c: #d4aa50; height: 30px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
    font: 600 13px 'Source Sans 3', sans-serif; letter-spacing: 0.02em; color: #d9c8a0; white-space: nowrap;
    background: rgba(8, 4, 1, 0.7); border: 2px solid rgba(120, 90, 40, 0.6); border-radius: 2px; transition: background 0.1s, border-color 0.1s, color 0.1s; }
  .mk-chip::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .mk-chip:hover { border-color: var(--c); color: #fff5d8; }
  .mk-chip.on { background: var(--c); border-color: #fff5d8; color: #140a02; box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
  .mk-chip.on::before { background: #140a02; }
  .mk-chip.era::before { display: none; }
  .mk-chip.era { justify-content: center; }
  .mk-chip .mk-n { margin-left: auto; font-weight: 400; font-size: 11px; opacity: 0.7; }
  .mk-sort { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .mk-sortbtn { height: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; user-select: none;
    font: 600 13px 'Source Sans 3', sans-serif; color: #d9c8a0; background: rgba(8, 4, 1, 0.7); border: 2px solid rgba(120, 90, 40, 0.6); border-radius: 2px; }
  .mk-sortbtn:hover { border-color: #d4aa50; color: #fff5d8; }
  .mk-sortbtn.on { background: #d4aa50; border-color: #fff5d8; color: #140a02; }
  .mk-sortbtn .mk-arrow { font-size: 11px; visibility: hidden; }
  .mk-sortbtn.on .mk-arrow { visibility: visible; }
  .mk-clear { margin-top: 2px; font-family: var(--font); font-size: 11px; letter-spacing: 0.1em; color: #ffb4a8; background: rgba(60, 12, 8, 0.9);
    border: 2px solid rgba(255, 122, 106, 0.8); border-radius: 2px; padding: 8px 10px; cursor: pointer; visibility: hidden; }
  .mk-side.filtering .mk-clear { visibility: visible; }

  .mk-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* results strip: what is showing, in words */
  .mk-strip { flex: 0 0 40px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px;
    background: rgba(24, 13, 4, 0.75); border-bottom: 1px solid rgba(180, 130, 40, 0.3); }
  .mk-count { font: 600 14px 'Source Sans 3', sans-serif; color: #f3e6c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mk-count b { color: #f0cf6c; }
  .mk-hint { margin-left: auto; font: 400 12px 'Source Sans 3', sans-serif; color: rgba(243, 230, 196, 0.55); white-space: nowrap; }

  /* ── GRID: 5 across at 174 x 262, 2.25 rows visible ──
       body 664 = 720 - 56 bar; grid viewport = 664 - 40 strip = 624, top padding 14
       → 610 of cards: 2 rows (262 x 2) + 2 gaps (12 x 2) = 548, leaving 62 = 0.24 of row three */
  .mk-main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; box-sizing: border-box; }
  .mk-main::-webkit-scrollbar { width: 8px; }
  .mk-main::-webkit-scrollbar-track { background: rgba(20, 10, 2, 0.80); }
  .mk-main::-webkit-scrollbar-thumb { background: rgba(180, 130, 40, 0.7); }
  .mk-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .mk-empty { font: 400 16px 'Crimson Text', serif; color: #d9c8a0; text-align: center; padding: 80px 0; }
  .mk-grid .db-card:hover { transform: translateY(-2px); }
  /* Pick circle, bottom-right of every tile: EMPTY when the card is not in the deck, a green CHECK
     when it is. Clicking it adds/removes the card (so does double-clicking the card). The hit area
     is 36px around a 24px circle; it sits clear of the cost/IP corners, the type icon and the
     name/era printed on the art. The gold frame still marks a selected tile. */
  .mk-pick { position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; cursor: pointer; z-index: 3; }
  .mk-pick::before { content: ''; position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%;
    border: 2px solid #fff5d8; background: rgba(10, 5, 1, 0.72); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.85), 0 0 5px rgba(0, 0, 0, 0.6);
    font: 700 15px/20px 'Source Sans 3', sans-serif; text-align: center; color: #0c1f0c; transition: background 0.1s, border-color 0.1s, box-shadow 0.1s; }
  .mk-pick:hover::before { border-color: #6fe08a; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.75), 0 0 8px rgba(111, 224, 138, 0.9); }
  .db-card.selected .mk-pick::before { content: '\2713'; background: #6fe08a; border-color: #0c1f0c; box-shadow: 0 0 6px rgba(111, 224, 138, 0.8); }

  /* mock-only switcher, OUTSIDE the stage */
  #mk-switch { position: fixed; left: 12px; bottom: 10px; z-index: 50; display: flex; flex-wrap: wrap; width: 296px; gap: 6px; align-items: center; font: 600 12px 'Source Sans 3', sans-serif; color: #bbb; }
  #mk-switch a { color: #f0cf6c; text-decoration: none; border: 1px solid #6a5420; padding: 3px 8px; border-radius: 3px; }
  #mk-switch a.cur { background: #f0cf6c; color: #140a02; }
  #mk-readout { position: fixed; left: 12px; bottom: 66px; z-index: 50; font: 400 12px 'Source Sans 3', sans-serif; color: #bbb; }
</style>
</head>
<body>
<div id="mk-viewport">
  <div id="mk-stage">
    <div class="mk-screen" id="mk-screen">
      <header class="mk-header">
        <div class="mk-hleft">
          <button class="mk-btn">&#8592; Home</button>
          <div class="mk-title">Deck Builder</div>
        </div>
        <div class="mk-hright">
          <nav class="mk-tabs" id="mk-tabs"></nav>
          <div class="mk-hdiv"></div>
          <div class="mk-help" title="Double-click a card, or click its circle, to add or remove it. Click a card once to read it.">?</div>
          <div class="mk-counter" id="mk-counter">15 / 15</div>
          <button class="mk-btn mk-play" id="mk-play">Let's Play</button>
        </div>
      </header>
      <div class="mk-body">
        <aside class="mk-side" id="mk-side">
          <div class="mk-search" id="mk-searchbox">
            <input id="mk-q" type="text" placeholder="Search cards…" autocomplete="off" spellcheck="false">
            <span class="mk-x" id="mk-qx" title="Clear search">&#10005;</span>
          </div>
          <div class="mk-group"><div class="mk-label">Sort by</div><div class="mk-sort" id="mk-sort"></div></div>
          <div class="mk-group"><div class="mk-label">Type</div><div class="mk-chips" id="mk-types"></div></div>
          <div class="mk-group"><div class="mk-label">Era</div><div class="mk-chips" id="mk-eras"></div></div>
          <button class="mk-clear" id="mk-clear">&#10005; Clear all filters</button>
        </aside>
        <section class="mk-right">
          <div class="mk-strip"><span class="mk-count" id="mk-count"></span><span class="mk-hint">Double-click a card or click its circle to add or remove · scroll for more</span></div>
          <main class="mk-main" id="mk-main"><div class="mk-grid" id="mk-grid"></div></main>
        </section>
      </div>
    </div>
  </div>
</div>
<div id="mk-switch">Mocks: <a class="cur" href="/mockups/deckbuilder-mock-sidebar.html">sidebar · 2.25 rows</a><a href="/mockups/deckbuilder-mock.html?rows=2">top band · 2 rows</a><a href="/mockups/deckbuilder-mock.html?rows=3">top band · 3 rows</a></div>
<div id="mk-readout"></div>

<script>window.SOG = window.SOG || {};</script>
<script src="js/cards.js"></script>
<script>
(function () {
  'use strict';

  // Scale the fixed 1280x720 stage to the window, as SOG.Stage does.
  var stage = document.getElementById('mk-stage');
  function fit() { var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();

  var TYPE_ORDER = ['Prehistory', 'Political', 'Religious', 'Military', 'Cultural', 'Exploration', 'Scientific', 'Labor', 'Economic'];
  var ERA_GROUPS = ['Prehistory', 'Mesopotamia', 'Egypt', 'Kush', 'India', 'World History'];
  function eraGroup(c) {
    var e = c.era || '';
    if (e === 'Prehistory' || e === 'Mesopotamia' || e === 'Egypt') return e;
    if (e === 'Kush' || e === 'Aksumite') return 'Kush';
    if (e === 'Harappan' || e === 'Early India') return 'India';
    return 'World History';
  }
  var cards = CARDS.filter(function (c) { return !c.token; });
  var DECK_SIZE = 15;

  /* SORT. Each key leads with itself and breaks ties with the others, so the default
     "Type" order is Type, then CC, then IP. Clicking the active key again flips the
     direction of the LEADING key only; the tie-breaks always run low to high. */
  var SORTS = [
    { key: 'type', label: 'Type', chain: ['type', 'cc', 'ip'] },
    { key: 'cc',   label: 'CC',   chain: ['cc', 'ip', 'type'] },
    { key: 'ip',   label: 'IP',   chain: ['ip', 'cc', 'type'] }
  ];
  var sortState = { key: 'type', dir: 1 };
  function val(c, k) { return k === 'type' ? TYPE_ORDER.indexOf(c.type) : c[k]; }
  function sorted(list) {
    var chain = SORTS.filter(function (x) { return x.key === sortState.key; })[0].chain;
    return list.slice().sort(function (a, b) {
      for (var i = 0; i < chain.length; i++) {
        var d = val(a, chain[i]) - val(b, chain[i]);
        if (d) return i === 0 ? d * sortState.dir : d;
      }
      return a.name.localeCompare(b.name);
    });
  }
  function paintSort() {
    Array.prototype.forEach.call(document.querySelectorAll('.mk-sortbtn'), function (b) {
      var on = b.dataset.key === sortState.key;
      b.classList.toggle('on', on);
      b.querySelector('.mk-arrow').textContent = (on && sortState.dir < 0) ? '\u25BC' : '\u25B2';
      b.title = on ? (sortState.dir > 0 ? 'Low to high. Click to reverse.' : 'High to low. Click to reverse.') : 'Sort by ' + b.dataset.label;
    });
  }
  SORTS.forEach(function (x) {
    var b = document.createElement('div'); b.className = 'mk-sortbtn'; b.dataset.key = x.key; b.dataset.label = x.label;
    b.innerHTML = '<span></span><span class="mk-arrow"></span>'; b.firstChild.textContent = x.label;
    b.addEventListener('click', function () {
      if (sortState.key === x.key) sortState.dir = -sortState.dir; else { sortState.key = x.key; sortState.dir = 1; }
      paintSort(); render(); document.getElementById('mk-main').scrollTop = 0;
    });
    document.getElementById('mk-sort').appendChild(b);
  });
  paintSort();
  var inDeck = {}; [26, 27, 28, 29, 30, 31, 32, 36, 33, 34, 35, 38, 39, 40, 41].forEach(function (id) { inDeck[id] = true; });

  // deck tabs
  var tabs = document.getElementById('mk-tabs');
  ['Deck 1', 'Deck 2', 'Deck 3', 'Deck 4', 'Deck 5', 'Deck 6'].forEach(function (n, i) {
    var t = document.createElement('div'); t.className = 'mk-tab' + (i === 0 ? ' active' : '');
    t.innerHTML = '<span></span><span class="mk-pencil">&#9998;</span>'; t.firstChild.textContent = n; tabs.appendChild(t);
  });

  var state = { q: '', types: {}, eras: {} };
  function chip(host, label, cls, color, bag) {
    var el = document.createElement('div'); el.className = 'mk-chip ' + cls; el.textContent = label;
    if (color) el.style.setProperty('--c', color);
    var n = document.createElement('span'); n.className = 'mk-n';
    n.textContent = cards.filter(function (c) { return cls === 'type' ? (c.type === label || c.type2 === label) : eraGroup(c) === label; }).length;
    el.appendChild(n);
    el.addEventListener('click', function () { bag[label] = !bag[label]; el.classList.toggle('on', !!bag[label]); render(); document.getElementById('mk-main').scrollTop = 0; });
    host.appendChild(el); return el;
  }
  var cssVar = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  TYPE_ORDER.forEach(function (t) { chip(document.getElementById('mk-types'), t, 'type', cssVar('--c-' + t.toLowerCase()) || '#d4aa50', state.types); });
  ERA_GROUPS.forEach(function (e) { chip(document.getElementById('mk-eras'), e, 'era', null, state.eras); });

  var q = document.getElementById('mk-q'), box = document.getElementById('mk-searchbox');
  q.addEventListener('input', function () { state.q = q.value.trim().toLowerCase(); box.classList.toggle('has-text', !!q.value); render(); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; state.q = ''; box.classList.remove('has-text'); render(); } });
  document.getElementById('mk-qx').addEventListener('click', function () { q.value = ''; state.q = ''; box.classList.remove('has-text'); render(); q.focus(); });
  document.getElementById('mk-clear').addEventListener('click', function () {
    q.value = ''; state.q = ''; box.classList.remove('has-text'); state.types = {}; state.eras = {};
    Array.prototype.forEach.call(document.querySelectorAll('.mk-chip.on'), function (c) { c.classList.remove('on'); });
    // chips hold a reference to the old bags — rebuild them against the fresh state
    document.getElementById('mk-types').innerHTML = ''; document.getElementById('mk-eras').innerHTML = '';
    TYPE_ORDER.forEach(function (t) { chip(document.getElementById('mk-types'), t, 'type', cssVar('--c-' + t.toLowerCase()) || '#d4aa50', state.types); });
    ERA_GROUPS.forEach(function (e) { chip(document.getElementById('mk-eras'), e, 'era', null, state.eras); });
    render();
  });

  /* mock-only: preset filters from the URL (?types=Military,Religious&eras=Egypt&q=move) for captures */
  (function () {
    var p = new URLSearchParams(location.search);
    function pre(list) { (list || '').split(',').forEach(function (t) {
      Array.prototype.forEach.call(document.querySelectorAll('.mk-chip'), function (c) { if (t && c.firstChild.textContent === t) c.click(); }); }); }
    pre(p.get('types')); pre(p.get('eras'));
    if (p.get('sort')) { sortState.key = p.get('sort'); sortState.dir = p.get('dir') === 'desc' ? -1 : 1; paintSort(); }
    if (p.get('deck')) { inDeck = {}; p.get('deck').split(',').forEach(function (id) { if (id) inDeck[+id] = true; }); }
    if (p.get('q')) { q.value = p.get('q'); setTimeout(function () { q.dispatchEvent(new Event('input')); }, 0); }
  })();

  function hay(c) { return [c.name, c.abilityName, c.ability, c.type, c.type2, c.era, c.civilization, eraGroup(c)].filter(Boolean).join(' ').toLowerCase(); }
  function active(bag) { return Object.keys(bag).filter(function (k) { return bag[k]; }); }
  function matches(c) {
    var ts = active(state.types), es = active(state.eras);
    if (ts.length && ts.indexOf(c.type) === -1 && ts.indexOf(c.type2) === -1) return false;   // OR within types
    if (es.length && es.indexOf(eraGroup(c)) === -1) return false;                              // OR within eras, AND across
    if (state.q) { var h = hay(c); if (!state.q.split(/\s+/).every(function (w) { return h.indexOf(w) !== -1; })) return false; }
    return true;
  }
  function deckCount() { return Object.keys(inDeck).filter(function (k) { return inDeck[k]; }).length; }
  function paintDeck() {
    var n = deckCount(), counter = document.getElementById('mk-counter');
    counter.textContent = n + ' / ' + DECK_SIZE; counter.classList.toggle('full', n === DECK_SIZE);
    document.getElementById('mk-play').classList.toggle('off', n !== DECK_SIZE);
    document.getElementById('mk-grid').classList.toggle('deck-full', n >= DECK_SIZE);
  }
  function toggle(c) {
    if (!inDeck[c.id] && deckCount() >= DECK_SIZE) {          // deck full: refuse, shake the counter
      var counter = document.getElementById('mk-counter'); counter.classList.remove('deny'); void counter.offsetWidth; counter.classList.add('deny');
      setTimeout(function () { counter.classList.remove('deny'); }, 400); return;
    }
    inDeck[c.id] = !inDeck[c.id]; paintDeck();
  }
  function tile(c) {
    var el = document.createElement('div');
    el.className = 'db-card type-' + c.type.toLowerCase();
    var wrap = document.createElement('div'); wrap.className = 'db-card-img-wrap';
    var img = document.createElement('img'); img.className = 'db-card-img'; img.alt = c.name; img.loading = 'lazy';
    // the tile is small: prefer the small art, fall back to the full card
    img.src = c.imageSm || c.image.replace(/\.jpg$/, '@sm.jpg');
    img.onerror = function () { this.onerror = null; this.src = c.image; };
    wrap.appendChild(img);
    var cc = document.createElement('div'); cc.className = 'db-overlay-cc'; cc.textContent = c.cc;
    var ip = document.createElement('div'); ip.className = 'db-overlay-ip'; ip.textContent = c.ip;
    var pick = document.createElement('div'); pick.className = 'mk-pick'; pick.setAttribute('role', 'checkbox');
    function paint() { var on = !!inDeck[c.id]; el.classList.toggle('selected', on); pick.setAttribute('aria-checked', on ? 'true' : 'false');
      pick.title = on ? 'In deck. Click to remove.' : 'Click to add to deck.'; }
    /* TWO ways to add/remove, both live:
         1. double-click anywhere on the card (today's behaviour)
         2. one click on the circle
       The circle swallows its own clicks so a single click there never opens the card
       reader, and it ignores the second click of a double-click so double-clicking the
       circle toggles once, not twice. */
    pick.addEventListener('click', function (e) { e.stopPropagation(); if (e.detail > 1) return; toggle(c); paint(); });
    pick.addEventListener('dblclick', function (e) { e.stopPropagation(); });
    el.addEventListener('dblclick', function () { toggle(c); paint(); });
    el.appendChild(wrap); el.appendChild(cc); el.appendChild(ip); el.appendChild(pick);
    paint();
    el.title = c.name + ' — ' + c.type + (c.era ? ' · ' + c.era : '');
    return el;
  }
  function render() {
    var grid = document.getElementById('mk-grid'); grid.innerHTML = '';
    var shown = sorted(cards.filter(matches));
    shown.forEach(function (c) { grid.appendChild(tile(c)); });
    var main = document.getElementById('mk-main');
    var empty = main.querySelector('.mk-empty'); if (empty) empty.remove();
    if (!shown.length) { var e = document.createElement('div'); e.className = 'mk-empty'; e.textContent = 'No cards match. Clear a filter or change the search.'; main.appendChild(e); }
    var filtering = !!(state.q || active(state.types).length || active(state.eras).length);
    document.getElementById('mk-side').classList.toggle('filtering', filtering);
    var parts = []; if (active(state.eras).length) parts.push(active(state.eras).join(' or ')); if (active(state.types).length) parts.push(active(state.types).join(' or ')); if (state.q) parts.push('“' + state.q + '”');
    document.getElementById('mk-count').innerHTML = (filtering ? parts.join(' · ') + ' — ' : 'All cards — ') + '<b>' + shown.length + '</b> of ' + cards.length;
    var first = grid.querySelector('.db-card');
    if (first) { var r = first.getBoundingClientRect(), s = stage.getBoundingClientRect().width / 1280;
      document.getElementById('mk-readout').textContent = 'tile ' + Math.round(r.width / s) + ' x ' + Math.round(r.height / s) + ' stage px · 5 across · 2.25 rows visible'; }
  }
  render(); paintDeck();
})();
</script>
</body>
</html>
